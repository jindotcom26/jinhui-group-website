<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 頁面未找到 | 金滙控股</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=3">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0a1f44 0%, #16305e 100%);
      font-family: 'Work Sans', -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      text-align: center; padding: 2rem;
    }
    .box h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 6rem; color: #c5a572; line-height: 1;
    }
    .box h2 { color: #fff; font-size: 1.4rem; margin: 1.2rem 0 0.6rem; font-weight: 600; }
    .box p { color: rgba(255,255,255,0.65); font-size: 0.95rem; margin-bottom: 2rem; }
    .box a {
      display: inline-block; text-decoration: none;
      background: #c5a572; color: #0a1f44;
      padding: 0.8rem 2.2rem; border-radius: 999px;
      font-weight: 600; font-size: 0.95rem; transition: opacity .2s;
    }
    .box a:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <h2>抱歉，您訪問的頁面不存在</h2>
    <p>The page you are looking for does not exist.</p>
    <a href="/">返回首頁 Back to Home</a>
  </div>
</body>
</html>
